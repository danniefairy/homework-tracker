<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyVault // Homework Problem Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-primary: #4f46e5;
            --accent-primary-hover: #4338ca;
            --accent-ai: #eab308;
            --danger-color: #ef4444;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 1100px;
            height: 650px;
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
        }

        .sidebar-header {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .subject-filter {
            margin-bottom: 12px;
        }

        .search-bar {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-bar:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .question-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 2px;
        }

        .question-list::-webkit-scrollbar {
            width: 4px;
        }
        .question-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .question-tab {
            display: flex;
            flex-direction: column;
            padding: 12px;
            border-radius: 8px;
            background-color: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            position: relative;
        }

        .question-tab:hover {
            background-color: #f1f5f9;
        }

        .question-tab.active {
            background-color: #eef2ff;
            border-color: #c7d2fe;
        }

        .tab-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .tab-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .question-tab.active .tab-title {
            color: var(--accent-primary);
        }

        .tab-preview {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 20px;
            margin-bottom: 6px;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-badge {
            display: inline-block;
            font-size: 11px;
            line-height: 1;
            padding: 5px 8px;
            border-radius: 999px;
            background-color: #e0e7ff;
            color: #4338ca;
            border: 1px solid #c7d2fe;
        }

        .delete-tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .delete-tab-btn:hover {
            color: var(--danger-color);
            background-color: #fee2e2;
        }

        .workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            background-color: var(--bg-card);
            overflow-y: auto;
        }

        .card-pane {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .pane-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pane-label .badge {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .bg-indigo { background-color: var(--accent-primary); }
        .bg-amber { background-color: var(--accent-ai); }
        .bg-green { background-color: #22c55e; }

        .textarea-input,
        .textarea-ai,
        .tag-input {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            line-height: 1.5;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: #fafafa;
            outline: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .textarea-input {
            flex-grow: 1;
            resize: none;
        }

        .tag-input {
            padding: 12px 16px;
        }

        .textarea-input:focus,
        .tag-input:focus {
            background-color: var(--bg-card);
            border-color: var(--accent-primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.03);
        }

        .textarea-ai {
            width: 100%;
            min-height: 260px;
            background-color: #fefcf6;
            resize: vertical;
            color: var(--text-secondary);
        }

        .answer-dialog {
            width: min(680px, calc(100% - 32px));
            max-height: calc(100% - 32px);
            margin: auto;
            padding: 24px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.2);
            color: var(--text-primary);
        }

        .answer-dialog::backdrop {
            background: rgba(15, 23, 42, 0.55);
        }

        .answer-dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .answer-dialog-header h2 {
            font-size: 18px;
        }

        .close-dialog-btn {
            background: transparent;
            border: 0;
            border-radius: 4px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 24px;
            line-height: 1;
            padding: 4px 8px;
        }

        .close-dialog-btn:hover {
            background: #f1f5f9;
            color: var(--text-primary);
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: -4px;
        }

        .submit-btn.secondary-btn {
            background: #eef2ff;
            color: var(--accent-primary);
            box-shadow: none;
        }

        .submit-btn.secondary-btn:hover {
            background: #e0e7ff;
            color: var(--accent-primary-hover);
        }

        .submit-btn:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }

        .submit-btn {
            background-color: var(--accent-primary);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background-color: var(--accent-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -1px rgba(79, 70, 229, 0.25);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
        
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 30px;
            padding: 0 10px;
        }

        .helper-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
    
        @media (max-width: 768px) {
            body {
                padding: 0;
                align-items: flex-start;
                min-height: auto;
            }
            .dashboard {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 16px;
                max-height: 260px;
            }
            .question-list { max-height: 180px; }
            .workspace { padding: 16px; gap: 16px; }
            .card-pane { flex: none; }
            .textarea-input, .textarea-ai { min-height: 180px; }
            .action-bar { justify-content: stretch; }
            .submit-btn { width: 100%; }
            .tab-title { font-size: 13px; }
            .tab-preview { font-size: 12px; }
            .tag-badge { font-size: 10px; }
        }
        @media (max-width: 480px) {
            .workspace { padding: 12px; }
            .textarea-input, .textarea-ai {
                min-height: 150px;
                font-size: 14px;
            }
            .tag-input, .search-bar { font-size: 14px; }
            .submit-btn {
                padding: 14px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="sidebar">
            <div class="sidebar-header">Homework Vault</div>
            <label class="pane-label" for="subjectFilter">Filter by subject</label>
            <select id="subjectFilter" class="search-bar subject-filter">
                <option value="">All subjects</option>
            </select>
            <div class="search-container">
                <input type="text" id="searchBar" class="search-bar" aria-label="Search questions, subjects or tags" placeholder="Search questions, subjects or tags...">
            </div>
            <div id="questionList" class="question-list"></div>
        </div>

        <div class="workspace">
            <div class="card-pane">
                <label class="pane-label" for="questionInput">
                    <span class="badge bg-indigo"></span> Target Homework Problem
                </label>
                <textarea id="questionInput" class="textarea-input" placeholder="Paste or type a question or assignment from any subject..."></textarea>
            </div>

            <div class="card-pane" style="flex: 0;">
                <label class="pane-label" for="subjectInput"><span class="badge bg-indigo"></span> Subject</label>
                <input type="text" id="subjectInput" class="tag-input" list="subjectSuggestions" placeholder="e.g. Math, History, Biology, or any subject">
                <datalist id="subjectSuggestions">
                    <option value="Math"></option><option value="Science"></option><option value="History"></option>
                    <option value="English"></option><option value="Languages"></option><option value="Art"></option>
                </datalist>
                <div class="helper-text">Enter any subject, or leave blank for Uncategorized.</div>
            </div>

            <div class="card-pane" style="flex: 0.45;">
                <label class="pane-label" for="tagInput">
                    <span class="badge bg-green"></span> Tags
                </label>
                <input type="text" id="tagInput" class="tag-input" placeholder="Add tags separated by commas, like chapter 3, essay, review">
                <div class="helper-text">Tags will be saved with the question and shown in the sidebar.</div>
            </div>

            <div class="card-pane" style="flex:0.35;">
                <label class="pane-label" for="apiKeyInput"><span class="badge bg-indigo"></span> OpenAI API Key</label>
                <input id="apiKeyInput" class="tag-input" type="password" placeholder="sk-...">
                <div class="helper-text">Stored only in this browser session.</div>
            </div>
            <div class="action-bar" style="justify-content:space-between;">
                <button id="generateBtn" class="submit-btn" type="button">Generate Answer</button>
                <button id="showAnswerBtn" class="submit-btn secondary-btn" type="button">View Answer</button>
                <button id="submitBtn" class="submit-btn" type="button">Save to Repository</button>
            </div>
        </div>
    </div>

    <dialog id="answerDialog" class="answer-dialog" aria-labelledby="answerDialogTitle">
        <div class="answer-dialog-header">
            <h2 id="answerDialogTitle">Answer</h2>
            <button id="closeAnswerBtn" class="close-dialog-btn" type="button" aria-label="Close answer">&times;</button>
        </div>
        <label class="pane-label" for="aiOutput"><span class="badge bg-amber"></span> Generated answer</label>
        <textarea id="aiOutput" class="textarea-ai" placeholder="Click Generate Answer to produce a detailed solution..." readonly></textarea>
    </dialog>

    <script>
        const SUPABASE_URL = "https://fzlbmrylnfeaswgeheic.supabase.co";
        const SUPABASE_KEY = "sb_publishable_JVwk5bJExnYt0Y9Ey0hlkQ_erC535r3";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const questionInput = document.getElementById('questionInput');
        const tagInput = document.getElementById('tagInput');
        const subjectInput = document.getElementById('subjectInput');
        const subjectFilter = document.getElementById('subjectFilter');
        const aiOutput = document.getElementById('aiOutput');
        const answerDialog = document.getElementById('answerDialog');
        const showAnswerBtn = document.getElementById('showAnswerBtn');
        const closeAnswerBtn = document.getElementById('closeAnswerBtn');
        const submitBtn = document.getElementById('submitBtn');
        const generateBtn = document.getElementById('generateBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const questionList = document.getElementById('questionList');
        const searchBar = document.getElementById('searchBar');

        let currentSearchQuery = "";
        let questions = [];
        const subjectTagPrefix = '__studyvault_subject__:';

        function normalizeTags(tagString) {
            if (!tagString) return [];
            return tagString
                .split(',')
                .map(tag => tag.trim())
                .filter(tag => tag.length > 0);
        }

        // Store the subject in the existing tags column so older database schemas still work.
        function readProblemTags(tagString) {
            let subject = '';
            const tags = [];
            normalizeTags(tagString).forEach(tag => {
                if (tag.startsWith(subjectTagPrefix) && !subject) {
                    try {
                        subject = decodeURIComponent(tag.slice(subjectTagPrefix.length));
                    } catch (error) {
                        tags.push(tag);
                    }
                } else {
                    tags.push(tag);
                }
            });
            return { subject, tags };
        }

        function updateSubjectFilter() {
            const selected = subjectFilter.value;
            const subjects = new Map();
            questions.forEach(question => {
                const subject = readProblemTags(question.tags).subject;
                if (subject && !subjects.has(subject.toLowerCase())) subjects.set(subject.toLowerCase(), subject);
            });
            subjectFilter.replaceChildren();
            const addOption = (value, label) => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = label;
                subjectFilter.appendChild(option);
            };
            addOption('', 'All subjects');
            addOption('__uncategorized__', 'Uncategorized');
            [...subjects.entries()].sort((a, b) => a[1].localeCompare(b[1])).forEach(([value, label]) => addOption('subject:' + value, label));
            subjectFilter.value = [...subjectFilter.options].some(option => option.value === selected) ? selected : '';
        }

        function filterQuestions() {
            const query = currentSearchQuery.toLowerCase();
            const selected = subjectFilter.value;
            renderSidebar(questions.filter(question => {
                const { subject, tags } = readProblemTags(question.tags);
                const matchesSubject = !selected || (selected === '__uncategorized__'
                    ? !subject : selected === 'subject:' + subject.toLowerCase());
                const content = question.text || question.question || '';
                return matchesSubject && [content, subject, ...tags].some(value => value.toLowerCase().includes(query));
            }));
        }

        async function fetchQuestions() {
            let query = supabaseClient.from('problems').select('*').order('id', { ascending: false });

            const { data, error } = await query;
            if (error) {
                console.error("Error reading database:", error);
                return;
            }

            questions = data || [];
            updateSubjectFilter();
            filterQuestions();
        }

        function renderSidebar(questions) {
            questionList.innerHTML = "";
            
            if (questions.length === 0) {
                questionList.innerHTML = `<div class="empty-state">No matching problems found.</div>`;
                return;
            }

            questions.forEach((q) => {
                const tab = document.createElement('div');
                tab.className = 'question-tab';

                // Robust fallback check for column names (text vs question)
                const problemText = q.text || q.question || "";
                const cleanPreview = problemText.replace(/\s+/g, ' ');
                const { subject, tags } = readProblemTags(q.tags);

                tab.innerHTML = `
                    <div class="tab-header-row">
                        <div class="tab-title"></div>
                        <button class="delete-tab-btn" title="Delete Problem">&times;</button>
                    </div>
                    <div class="tab-preview"></div>
                    <div class="tag-row"></div>
                `;
                tab.querySelector('.tab-title').textContent = `Problem #${q.id}`;
                tab.querySelector('.tab-preview').textContent = cleanPreview || 'Empty description';
                const tagRow = tab.querySelector('.tag-row');
                [subject || 'Uncategorized', ...tags].forEach(value => {
                    const badge = document.createElement('span');
                    badge.className = 'tag-badge';
                    badge.textContent = value;
                    tagRow.appendChild(badge);
                });

                tab.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-tab-btn')) return;

                    document.querySelectorAll('.question-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    questionInput.value = problemText;
                    subjectInput.value = subject;
                    tagInput.value = tags.join(', ');
                    aiOutput.value = ""; 
                });

                const deleteBtn = tab.querySelector('.delete-tab-btn');
                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    
                    if (confirm(`Are you sure you want to delete Problem #${q.id}?`)) {
                        const { error } = await supabaseClient
                            .from('problems')
                            .delete()
                            .eq('id', q.id);

                        if (error) {
                            alert("Delete Failed: " + error.message);
                            console.error(error);
                        } else {
                            if (questionInput.value === problemText) {
                                questionInput.value = "";
                                tagInput.value = "";
                                subjectInput.value = "";
                            }
                            fetchQuestions();
                        }
                    }
                });

                questionList.appendChild(tab);
            });
        }

        function showAnswer() {
            if (!answerDialog.open) answerDialog.showModal();
        }

        showAnswerBtn.addEventListener('click', showAnswer);
        closeAnswerBtn.addEventListener('click', () => answerDialog.close());

        generateBtn.addEventListener("click", async () => {
            const key = apiKeyInput.value.trim();
            const q = questionInput.value.trim();
            const subject = subjectInput.value.trim();
            
            if (!key) {
                alert("Validation Error: Please enter your OpenAI API Key.");
                return;
            }
            if (!q) {
                alert("Validation Error: Please enter a homework problem text before generating.");
                return;
            }
            
            aiOutput.value = "[1/3] Connecting to OpenAI API endpoints...";
            showAnswer();
            generateBtn.disabled = true;
            
            try {
                const r = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + key
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: "You are a tutor for all school subjects. Explain the answer clearly and accurately, with the reasoning or examples needed for the subject and assignment. Use plain readable text." },
                            { role: "user", content: subject ? `Subject: ${subject}\n\nAssignment:\n${q}` : q }
                        ],
                        temperature: 0.3
                    })
                });

                aiOutput.value = "[2/3] Response received. Parsing solution structural data...";
                const data = await r.json();
                
                if (!r.ok) {
                    throw new Error(data.error?.message || `HTTP error! Status: ${r.status}`);
                }

                aiOutput.value = data.choices[0].message.content.trim();

            } catch (e) {
                aiOutput.value = "Execution Failed!\n\nDetails:\n" + e.message + "\n\nPlease double check if your API key is correct, active, or if your network limits outbound requests to api.openai.com.";
                alert("API Error: " + e.message);
            } finally {
                generateBtn.disabled = false;
            }
        });

        // Save data to cloud with fallback column checks
        submitBtn.addEventListener('click', async () => {
            const text = questionInput.value.trim();
            const tags = normalizeTags(tagInput.value);
            const subject = subjectInput.value.trim();
            if (subject) tags.unshift(subjectTagPrefix + encodeURIComponent(subject));
            const storedTags = tags.join(', ');

            if (!text) return;

            // Attempting insertion with 'text' column, falling back if schema uses 'question'
            let insertPayload = { text: text, tags: storedTags };
            let { error } = await supabaseClient
                .from('problems')
                .insert([insertPayload]);

            if (error && error.message.includes("column")) {
                // Retry insertion using 'question' column if 'text' column doesn't exist
                insertPayload = { question: text, tags: storedTags };
                const retry = await supabaseClient
                    .from('problems')
                    .insert([insertPayload]);
                error = retry.error;
            }

            if (error) {
                alert("Database Error: " + error.message);
                console.error(error);
            } else {
                questionInput.value = "";
                tagInput.value = "";
                subjectInput.value = "";
                fetchQuestions();
            }
        });

        searchBar.addEventListener('input', (e) => {
            currentSearchQuery = e.target.value.trim();
            filterQuestions();
        });

        subjectFilter.addEventListener('change', filterQuestions);

        fetchQuestions();
    </script>
</body>
</html>
